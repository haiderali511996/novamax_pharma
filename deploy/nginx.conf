# Reverse proxy for erp.novamaxpharma.com.
#
# Setup on the server:
#   1. Point the domain's DNS A record at this server's IP.
#   2. sudo cp deploy/nginx.conf /etc/nginx/sites-available/erp.novamaxpharma.com
#      sudo ln -s /etc/nginx/sites-available/erp.novamaxpharma.com /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d erp.novamaxpharma.com   (installs TLS + rewrites this file to redirect HTTP -> HTTPS)
#
# Assumes docker-compose.prod.yml is running with the backend on 127.0.0.1:5000
# and the frontend on 127.0.0.1:3000 (both bound to localhost only - nginx is
# the only thing exposed to the internet on 80/443).

server {
    listen 80;
    server_name erp.novamaxpharma.com;

    client_max_body_size 20m;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded license documents / expense receipts
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js frontend (everything else)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
